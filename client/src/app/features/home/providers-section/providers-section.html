<section class="providers-section" id="providers">
  <div class="shell">
    <div class="section-head"><div><p class="eyebrow">{{ content().eyebrow }}</p><h2>{{ content().title }}</h2></div><p>{{ content().introduction }}</p></div>
    <div class="provider-list">
      @for (provider of content().items; track provider.city) {
        <article class="provider-row"><div><h3>{{ provider.city }}</h3><p>{{ provider.focus }}</p></div><span class="provider-tag">{{ provider.region }}</span><a class="text-link" href="#enquiry">{{ content().actionLabel }} <span aria-hidden="true">→</span></a></article>
      }
    </div>
    <p class="provider-disclaimer">{{ content().disclaimer }}</p>
  </div>
</section>
